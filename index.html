<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />

    <!-- Theme & status bar color -->
    <meta name="theme-color" content="#000000" />
    <meta name="background-color" content="#000000" />

    <!-- Prevent tap delay in older WebViews -->
    <meta name="HandheldFriendly" content="true" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO -->
    <meta name="description" content="Defend the galaxy against alien invasion. Upgrade your ship and survive 30 waves in this intense space shooter." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Galaxy Outlast</title>

    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <div id="orientation-blocker" class="orientation-blocker">
      <div class="blocker-content">
        <div class="phone-icon">🔄</div>
        <div class="blocker-title">PORTRAIT MODE REQUIRED</div>
        <p class="blocker-text">Please rotate your device to portrait mode to play Galaxy Outlast.</p>
      </div>
    </div>

    <div id="root"></div>

    <!-- DEVELOPER DIAGNOSTICS & LAG / STUTTER PROFILER OVERLAY -->
    <div id="dev-diag-panel" style="position:fixed;top:10px;right:10px;z-index:999999;background:rgba(2,11,22,0.92);border:1.5px solid #00ffaa;border-radius:10px;padding:10px 14px;color:#00ffaa;font-family:'Outfit',sans-serif;font-size:12px;box-shadow:0 0 15px rgba(0,255,170,0.3);width:270px;user-select:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;">
      <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,255,170,0.25);padding-bottom:6px;margin-bottom:8px;cursor:pointer;" id="dev-header">
        <span id="dev-header-title" style="font-family:'Cinzel Decorative',serif;font-weight:700;font-size:13px;letter-spacing:1px;color:#00e5ff;">DEV DIAGNOSTICS</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <button id="diag-copy-btn" style="background:rgba(0,51,34,0.8);border:1px solid #00ffaa;color:#00ffaa;border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer;font-weight:600;">COPY</button>
          <button id="dev-toggle-btn" style="background:#002233;border:1px solid #00ffaa;color:#00ffaa;border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer;">MINIMIZE</button>
          <button id="dev-close-btn" style="background:#330011;border:1px solid #ff3366;color:#ff3366;border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer;font-weight:700;" title="Close Diagnostics Panel">✕</button>
        </div>
      </div>
      
      <div id="dev-body">
        <!-- FPS & Compute Frame Time -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <div style="background:rgba(0,30,50,0.6);padding:6px;border-radius:6px;border:1px solid rgba(0,255,170,0.15);">
            <div style="font-size:9px;color:#6ca;text-transform:uppercase;">FPS</div>
            <div id="dev-fps-val" style="font-size:18px;font-weight:700;color:#00ffaa;">60</div>
          </div>
          <div style="background:rgba(0,30,50,0.6);padding:6px;border-radius:6px;border:1px solid rgba(0,255,170,0.15);">
            <div style="font-size:9px;color:#6ca;text-transform:uppercase;">FRAME COMPUTE</div>
            <div id="dev-frametime-val" style="font-size:18px;font-weight:700;color:#00ffaa;">4.2 ms</div>
          </div>
        </div>

        <!-- Inter-Frame Interval & RAM -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <div style="background:rgba(0,30,50,0.6);padding:6px;border-radius:6px;border:1px solid rgba(0,255,170,0.15);">
            <div style="font-size:9px;color:#6ca;text-transform:uppercase;">INTERVAL</div>
            <div id="dev-interval-val" style="font-size:14px;font-weight:600;color:#00e5ff;">16.6 ms</div>
          </div>
          <div style="background:rgba(0,30,50,0.6);padding:6px;border-radius:6px;border:1px solid rgba(0,255,170,0.15);">
            <div style="font-size:9px;color:#6ca;text-transform:uppercase;">RAM (HEAP)</div>
            <div id="dev-ram-val" style="font-size:14px;font-weight:600;color:#00aaff;">N/A</div>
          </div>
        </div>

        <!-- Lag Spikes & GC -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <div style="background:rgba(0,30,50,0.6);padding:6px;border-radius:6px;border:1px solid rgba(0,255,170,0.15);">
            <div style="font-size:9px;color:#6ca;text-transform:uppercase;">GAMEPLAY SPIKES</div>
            <div id="dev-spikes-val" style="font-size:14px;font-weight:600;color:#ff3366;">0</div>
          </div>
          <div style="background:rgba(0,30,50,0.6);padding:6px;border-radius:6px;border:1px solid rgba(0,255,170,0.15);">
            <div style="font-size:9px;color:#6ca;text-transform:uppercase;">GC PAUSES</div>
            <div id="dev-gc-val" style="font-size:14px;font-weight:600;color:#cc66ff;">0</div>
          </div>
        </div>

        <!-- Real-time Compute Time Sparkline Canvas Graph -->
        <div style="margin-bottom:8px;">
          <div style="font-size:9px;color:#6ca;text-transform:uppercase;margin-bottom:2px;">COMPUTE TIME SPARKLINE (MS)</div>
          <canvas id="dev-sparkline-canvas" width="240" height="40" style="background:#000814;border:1px solid rgba(0,255,170,0.2);border-radius:4px;display:block;width:100%;height:40px;"></canvas>
        </div>

        <!-- Recent Lag Spikes Log with In-Game Time & Copy Report -->
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;">
            <span style="font-size:9px;color:#6ca;text-transform:uppercase;">GAMEPLAY STUTTER LOG</span>
            <button id="dev-clear-report-btn" style="background:#220505;border:1px solid #ff4444;color:#ff6666;border-radius:3px;padding:1px 6px;font-size:9px;cursor:pointer;font-weight:bold;margin-right:4px;">CLEAR</button><button id="dev-copy-report-btn" style="background:#003322;border:1px solid #00ffaa;color:#00ffaa;border-radius:3px;padding:1px 6px;font-size:9px;cursor:pointer;">COPY REPORT</button>
          </div>
          <div id="dev-stutter-log" style="font-size:9.5px;font-family:monospace;background:#00050f;padding:4px 6px;border-radius:4px;height:55px;overflow-y:auto;color:#ffaa00;border:1px solid rgba(255,170,0,0.2);white-space:nowrap;">
            No active gameplay stutters.
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
